<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambulance Tracking · Hospital Module</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
</head>
<body>
<div id="shell"></div>
<div id="page" hidden>

<div class="page-head"><h1>🚑 Ambulance Tracking</h1><span class="muted small">View only: movement data comes from the Control Room</span><span class="sp"></span>
  <select id="ambSel" style="width:auto;min-width:240px"></select></div>
<div class="grid cards" id="hdr" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"></div>
<div class="grid two">
  <div class="card" id="trackerWrap"><div id="tracker"></div></div>
  <div class="grid">
    <div class="card"><h2>Emergency details</h2><div id="side"></div></div>
    <div class="card"><h2>Activity</h2><ul class="list timeline" id="timeline"></ul></div>
  </div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script><script src="/static/js/app.js"></script><script src="/static/js/map.js"></script><script src="/static/js/tracker.js"></script><script src="/static/js/ambulance.js"></script>
</body>
</html>
